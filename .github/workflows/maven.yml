name: Java CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin

    - name: Wait for JitPack to build the Slimefun4 fork
      run: |
        GROUP="com.github.xsinexdes"
        ARTIFACT="Slimefun4"
        VERSION="experimental-SNAPSHOT"
        API_URL="https://jitpack.io/api/builds/${GROUP}/${ARTIFACT}/${VERSION}"

        echo "Disparando build en JitPack para ${GROUP}:${ARTIFACT}:${VERSION}..."

        STATUS="unknown"
        for i in $(seq 1 45); do
          RESPONSE=$(curl -s "$API_URL")
          STATUS=$(echo "$RESPONSE" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | grep -o '"[^"]*"$' | tr -d '"')
          echo "Intento $i/45 -> status: ${STATUS:-sin respuesta} | $RESPONSE"

          if [ "$STATUS" == "ok" ]; then
            echo "JitPack ya tiene el jar listo."
            break
          fi

          if [ "$STATUS" == "error" ]; then
            echo "JitPack reporta ERROR compilando el fork. Revisa el log:"
            echo "https://jitpack.io/com/github/${GROUP#com.github.}/${ARTIFACT}/${VERSION}/build.log"
            exit 1
          fi

          sleep 20
        done

        if [ "$STATUS" != "ok" ]; then
          echo "JitPack no terminó a tiempo (status: $STATUS). Reintenta el workflow en unos minutos; JitPack ya debería tener el build cacheado."
          exit 1
        fi

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExtraGear
        path: target/*.jar
